; =====================================================================
;  MULTIPLICADORES GERAIS - Echoes of Valdoria
; =====================================================================
; Cada valor multiplica o normal do jogo: 1.0 = normal, 2.0 = dobro, 0.5 = metade.
; [Todos] vale para todos os modos. [Modo N] vale só para aquele modo.
; Os dois se multiplicam (Todos 2.0 x Modo 3 0.5 = 1.0 no MOBA).
; Apagou uma linha, um modo inteiro ou o arquivo? Volta para 1.0.
; Use ponto ou vírgula (0.8 ou 0,8). Texto depois de ; é comentário.
; Mudou o arquivo com o jogo aberto? Painel F1 -> "Recarregar multiplicadores".
;
; IDS DOS MODOS:
;   0 = Campo de Treino
;   1 = Treino em Nova Paulicéia
;   2 = Mata-mata
;   3 = Guardian Spots (MOBA)
;
; CHAVES:
;   Dano              todo dano causado (heróis, bots e minions)
;   DanoFisico        parte física do golpe
;   DanoMagico        parte mágica do golpe
;   DanoAtaqueBasico  botão esquerdo e soco (V)
;   DanoHabilidades   habilidades e passivas
;   Cura              toda cura (habilidades, regeneração, vampirismo, roubo de vida)
;   Vampirismo        quanto o ataque básico / soco cura
;   RouboDeVida       quanto as habilidades curam
;   Vida              vida máxima dos heróis
;   Armadura          armadura máxima
;   Escudo            escudo máximo
;   VidaGuardioes     vida dos Guardian Spots
;   Recarga           tempo de recarga das habilidades (0.5 = metade do tempo)
;   CargaUltimate     carga de ultimate ganha
;   Velocidade        velocidade de movimento
;   Ouro              ouro / créditos ganhos
;   Experiencia       XP ganha (níveis do MOBA)
;   TempoRenascer     tempo morto até renascer

[Todos]
Dano=1.0
DanoFisico=1.0
DanoMagico=1.0
DanoAtaqueBasico=1.0
DanoHabilidades=1.0
Cura=1.0
Vampirismo=1.0
RouboDeVida=1.0
Vida=1.0
Armadura=1.0
Escudo=1.0
VidaGuardioes=1.0
Recarga=1.0
CargaUltimate=1.0
Velocidade=1.0
Ouro=1.0
Experiencia=1.0
TempoRenascer=1.0

[Modo 0]   ; Campo de Treino

[Modo 1]   ; Treino em Nova Paulicéia

[Modo 2]   ; Mata-mata

[Modo 3]   ; Guardian Spots (MOBA)
